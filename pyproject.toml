[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alfworld"
requires-python = ">=3.9"
dynamic = ["version", "description", "license", "dependencies", "optional-dependencies"]

[tool.uv]
# uv also resolves optional extras. Legacy visdom needs pkg_resources at build time.
build-constraint-dependencies = ["setuptools<81"]

# Keep the Linux continual environment compatible with CUDA 12.8 drivers.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version >= '3.11'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version >= '3.11'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
