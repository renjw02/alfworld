# Online response-only SFT, with verified interactions from successful episodes.
method: success-only-sft
action_mode: admissible
output_dir: runs/success-only-sft
max_steps: 50
checkpoint_interval: 10
memory_scope: stream
stream:
  order: task_blocked
  seed: 42
  task_order: [1, 2, 3, 4, 5, 6]
  split: valid_seen
model:
  path: /data/jiawei/models/Qwen3.5-9B
  device: cuda:0
  max_input_tokens: 65536
  max_new_tokens: 1024
  backend: hf
sft:
  history_interactions: 5
  # Pilot: 2048 excludes 28.5%; 4096 excludes 0.26% of eligible examples.
  # Whole oversize samples are skipped, never sliced or stripped of history.
  max_seq_tokens: 4096
training:
  rank: 16
  alpha: 32
  dropout: 0.0
  learning_rate: 0.00001
  weight_decay: 0.0
  max_grad_norm: 1.0
  # Legacy NTP option; success-only-sft never uses token chunks.
  chunk_tokens: 2048
