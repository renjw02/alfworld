# Every method starts from the same base model in its own output directory.
method: memoryless                 # memoryless | icl | dc-cumulative | history-ntp | history-ntp-assistant | history-ntp-assistant-success | ascent (see continual-ascent.yaml)
action_mode: admissible            # provide the current environment's exact valid commands
window_episodes: 4                 # includes the current episode
max_steps: 50                      # counts malformed generations too
output_dir: runs/experiment
cheatsheet_max_new_tokens: 2048    # DC-Cumulative: one curator call after each episode
checkpoint_interval: 10            # all parameter-training methods; also save at completion
memory_scope: stream               # task_type resets history/cheatsheet/LoRA between categories
stream:
  order: shuffled                 # shuffled | task_blocked
  seed: 42
  task_order: [1, 2, 3, 4, 5, 6]  # used by task_blocked
  data_dir: ~/.cache/alfworld      # CLI --data-dir or ALFWORLD_DATA may override
  split: valid_seen
  manifest: null                  # reuse a saved manifest.json
  limit: null                     # full stream; set a small number for smoke tests
model:
  path: /data/jiawei/models/Qwen3.5-9B
  device: cuda:0
  devices: []                     # inference only; e.g. [cuda:0, cuda:1] for layer sharding
  gpu_memory_gib: []               # optional allocator cap for each entry in devices
  backend: hf                     # mock is ONLY for control-flow testing
  max_input_tokens: 65536
  context_overflow: truncate_oldest # preserve system prompt; discard oldest history first
  max_new_tokens: 1024             # reasoning and action together
training:
  rank: 16
  alpha: 32
  dropout: 0.0
  learning_rate: 0.00001
  weight_decay: 0.0
  max_grad_norm: 1.0
  chunk_tokens: 2048
