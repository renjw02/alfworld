method: negative-ul
action_mode: admissible
window_episodes: 4
max_steps: 50
output_dir: runs/heat-place-200-negative-ul-seed42
cheatsheet_max_new_tokens: 2048
checkpoint_interval: 10
memory_scope: stream
stream:
  order: shuffled
  seed: 42
  task_order:
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  data_dir: ~/.cache/alfworld
