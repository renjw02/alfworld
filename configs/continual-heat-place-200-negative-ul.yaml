  backend: hf
  max_input_tokens: 65536
  context_overflow: truncate_oldest
  max_new_tokens: 1024
training:
  rank: 16
  alpha: 32
  dropout: 0.0
  learning_rate: 1.0e-05
  weight_decay: 0.0
  max_grad_norm: 1.0
  negative_ul_steps: 4
