# Repeat ASCENT once through episode 200, retaining weights after 50/100/150/200.
# Same heat200 seed42 manifest and learning settings as the original run.
method: ascent
action_mode: admissible
window_episodes: 4
max_steps: 50
output_dir: runs/heat-place-200-ascent-milestones-seed42
cheatsheet_max_new_tokens: 2048
checkpoint_interval: 10
checkpoint_keep_positions: [50, 100, 150, 200]
memory_scope: stream
stream:
  order: shuffled
  seed: 42
  task_order: [1, 2, 3, 4, 5, 6]
  data_dir: ~/.cache/alfworld
  split: heat_place_200
  manifest: configs/manifests/heat_place_200.seed42.json
  limit: 200
model:
  path: /data/jiawei/models/Qwen3.5-9B
  device: cuda:0
  backend: hf
  max_input_tokens: 65536
  context_overflow: truncate_oldest
  max_new_tokens: 1024
ascent:
  kl_direction: forward  # override with --kl-direction reverse for ASCENT
  rank: 16
  alpha: 32
  dropout: 0.0
  learning_rate: 0.00015
  weight_decay: 0.0
  max_grad_norm: 1.0
  optimizer_steps: 2
  logits_chunk_tokens: 32
